databases:
  - name: lycee
    plan: free
    region: frankfurt

services:
  - type: web
    name: lycee-backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn lycee.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: lycee
          property: database
      - key: DB_USER
        fromDatabase:
          name: lycee
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lycee
          property: password
      - key: DB_HOST
        fromDatabase:
          name: lycee
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lycee
          property: port
      - key: ALLOWED_HOSTS
        value: .onrender.com
